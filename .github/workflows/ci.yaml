name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Analyze and test the example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Catches the things that only surface at publish time: missing
      # description bounds, a stale CHANGELOG, files that would ship by
      # accident.
      - run: dart pub publish --dry-run
      - run: dart pub global activate pana
      - run: dart pub global run pana --no-warning --exit-code-threshold 0 .
