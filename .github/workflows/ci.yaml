name: ci

# Pushes to main run these same checks through release.yaml, which calls this
# workflow and then publishes if the version was bumped.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Analyze and test the example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Printed, not asserted. A timing gate on a shared runner fails for
      # reasons that have nothing to do with the code, and a benchmark that
      # cries wolf gets ignored. The frame benchmark does assert one thing —
      # that the laid-out row count stays bounded — because that is a
      # correctness claim rather than a timing one.
      - run: flutter test benchmark/frame_benchmark.dart
      - run: flutter test benchmark/measurement_benchmark.dart

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Catches the things that only surface at publish time: missing
      # description bounds, a stale CHANGELOG, files that would ship by
      # accident.
      - run: dart pub publish --dry-run
      - run: dart pub global activate pana
      - run: dart pub global run pana --no-warning --exit-code-threshold 0 .
