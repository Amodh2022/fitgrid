name: pages

# Publishes the website: the landing page and guides in site/, the screenshots,
# and the example gallery built for the web under /demo/.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build the example gallery for the web
        working-directory: example
        run: |
          flutter pub get
          flutter build web --release --base-href /fitgrid/demo/
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r screenshots _site/screenshots
          cp -r example/build/web _site/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
