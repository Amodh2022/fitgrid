name: fitgrid_table
description: >-
  A fast Flutter data table and data grid that measures column widths and paints
  cells: sorting, filters, cell editing, grouping and xlsx export over a
  million rows.
version: 0.1.3
homepage: https://fitgrid-e734.vercel.app/
repository: https://github.com/Amodh2022/fitgrid
issue_tracker: https://github.com/Amodh2022/fitgrid/issues

topics:
  - table
  - data-table
  - data-grid
  - spreadsheet
  - performance

screenshots:
  - description: 'Columns sized to their content, sorting, row selection and footer totals.'
    path: screenshots/overview.png
  - description: 'Spreadsheet editing: a cell range with a fill handle, multi-column sort priorities.'
    path: screenshots/spreadsheet.png
  - description: 'Header bands, a filtered column, per-column menus and saved layouts.'
    path: screenshots/filters.png
  - description: 'Two-level grouping with sticky group headers.'
    path: screenshots/grouping.png
  - description: 'Detail rows with nested grids, in dark mode.'
    path: screenshots/detail.png
  - description: 'Data bars, progress tracks and sparklines painted in cells.'
    path: screenshots/charts.png

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

# Core has zero non-Flutter dependencies, on purpose — xlsx export included,
# which is written in pure Dart. Heavy or opinionated things (PDF, state
# management, localization) either live in a companion package or are exposed
# as hooks for the host to wire up.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
